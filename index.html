/* Vitrine: três posições reais, profundidade uniforme e faces sem interseção. */
.shelf{isolation:isolate;transform-style:preserve-3d;overflow:visible}
.choice{transform-origin:center center;backface-visibility:hidden;transform-style:preserve-3d}
.choice[data-pos="-1"]{--x:clamp(-365px,-29vw,-165px);--scale:.68;--rot:18deg;--op:.48;--bright:.65;--blur:.35px;--z:1}
.choice[data-pos="1"]{--x:clamp(165px,29vw,365px);--scale:.68;--rot:-18deg;--op:.48;--bright:.65;--blur:.35px;--z:1}
.choice[data-pos="0"]{--z:5;--rot:0deg;--op:1;--bright:1.06;--blur:0px}
.choice .book{transform-style:preserve-3d;backface-visibility:hidden}
@media(max-width:700px){
.choice[data-pos="-1"]{--x:-39vw;--scale:.57;--rot:15deg;--op:.42;--bright:.6;--blur:.4px}
.choice[data-pos="1"]{--x:39vw;--scale:.57;--rot:-15deg;--op:.42;--bright:.6;--blur:.4px}
}
/* A saída reutiliza o mesmo movimento de abertura, executado em sentido inverso. */
.intro.returning .choice[data-pos="0"]{animation:bookApproach .95s 1.08s cubic-bezier(.22,.88,.24,1) both reverse,portalZoom 1.08s cubic-bezier(.18,.84,.24,1) both reverse;z-index:60;transform-style:preserve-3d}
.intro.returning .choice[data-pos="0"] .book{animation:frontCoverOpen 1s 1s cubic-bezier(.22,.86,.26,1) both reverse;transform-origin:left center;backface-visibility:hidden;z-index:3}
.intro.returning .choice[data-pos="0"]::before{inset:3% 4% 3% 7%;border-radius:4px 9px 9px 4px;background:linear-gradient(90deg,#c8b699,#f0e5d2 7%,#fffdfa 16%,#f1e8da 44%,#fffdfa 58%,#eadcc7);z-index:2;animation:pageSpread .98s 1.01s cubic-bezier(.2,.82,.24,1) both reverse}
.intro.returning .choice[data-pos="0"]::after{inset:-34%;border-radius:50%;background:radial-gradient(circle,#fff7dc,#f8e9c5 12%,rgba(246,222,176,.88) 18%,rgba(244,212,162,.38) 32%,transparent 62%);filter:blur(6px);z-index:1;animation:portalGlow 1.25s .4s ease-out both reverse}
.intro.returning .choice:not([data-pos="0"]){animation:sideFade .5s 1.5s ease both reverse}
.intro.returning .topbar,.intro.returning .choice-caption,.intro.returning .navigation,.intro.returning .entry,.intro.returning .eyebrow,.intro.returning .intro-title,.intro.returning .intro-sub{animation:uiFade .4s 1.5s ease both reverse}

.section-shell{padding:28px;margin-top:22px;position:relative;z-index:1}.section-shell + .section-shell{margin-top:18px}.section-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--tone);font-weight:800}.section-shell h2{font:clamp(30px,3.7vw,48px)/1.08 'Playfair Display',Georgia,serif;color:var(--deep);margin:12px 0 18px}.text-aside{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:28px}.text-aside p{font-size:16px;line-height:1.9;color:#3f4d46;margin:0 0 16px}.text-aside p:last-child{margin-bottom:0}.theme-note{padding:22px;border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--tone),white 92%),rgba(255,255,255,.85));border:1px solid rgba(20,20,20,.05)}.theme-note h3{font:24px 'Playfair Display',Georgia,serif;color:var(--deep);margin:0 0 12px}.theme-note p{font-size:14px;line-height:1.78;color:#516059}.theme-note .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.theme-note .chips span{font-size:12px;padding:8px 12px;border-radius:999px;background:#fff;border:1px solid rgba(20,20,20,.06);color:var(--deep);font-weight:700}

/* Ilustracoes editoriais exclusivas: cada abertura parte de elementos reais da obra. */
.issue-side{grid-template-rows:auto minmax(250px,1fr)}
.book-art{position:relative;min-height:250px;aspect-ratio:1.2/1;overflow:hidden;border-radius:22px;isolation:isolate;box-shadow:0 18px 48px rgba(0,0,0,.12);background:var(--deep)}
.book-art svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.book-art .art-caption{position:absolute;left:18px;bottom:15px;color:#fff;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;text-shadow:0 1px 8px #0008}
.book-art--0{background:#572e2b}.book-art--1{background:#d4b552}.book-art--2{background:#34584d}
.book-art .rail-light{animation:railPulse 3.6s ease-in-out infinite alternate}
.book-art .rail-thread{stroke-dasharray:11 13;animation:threadTravel 12s linear infinite}
.book-art .desk-route{stroke-dasharray:8 12;animation:routeTravel 10s linear infinite}
.book-art .mind-clock{transform-box:fill-box;transform-origin:center;animation:clockTurn 24s linear infinite}
.book-art .zen-ripple{transform-box:fill-box;transform-origin:center;animation:zenBreathe 5s ease-in-out infinite}
.book-art .zen-leaf{transform-box:fill-box;transform-origin:center;animation:leafDrift 7s ease-in-out infinite alternate}
@keyframes railPulse{to{opacity:.35;filter:brightness(1.5)}}
@keyframes threadTravel{to{stroke-dashoffset:-240}}
@keyframes routeTravel{to{stroke-dashoffset:-180}}
@keyframes clockTurn{to{transform:rotate(360deg)}}
@keyframes zenBreathe{50%{transform:scale(1.08);opacity:.42}}
@keyframes leafDrift{to{transform:translate(9px,-8px) rotate(6deg)}}
.feature-shell{background:transparent;border:0;box-shadow:none;overflow:visible}
.feature-visual{display:block;min-height:0}.feature-visual>.book-art{display:none}

const books=[
{title:'Canção para ninar menino grande',short:'Canção para ninar menino grande',cover:'Canção para ninar\nmenino grande',author:'Conceição Evaristo',small:'Conceição Evaristo',year:'2022 · Editora Pallas',label:'Memória, afetos e identidade',tone:'#ab7650',halo:'#6b4a34',theme:0,coverImage:"imagens/capa-0.webp",coverPosition:"50% 50%",summary:'Romance de Conceição Evaristo que acompanha a trajetória de Fio Jasmim e revisita relações, masculinidade, racismo e afetos nas experiências de mulheres negras.',intro:'Em uma narrativa atravessada por memória, encontros e deslocamentos, Conceição Evaristo constrói um olhar sensível sobre relações humanas, identidade e escuta.',discussion:'Ao acompanhar a vida de Fio Jasmim, o livro apresenta relações afetivas e familiares, tensões sociais e o modo como raça e gênero atravessam experiências pessoais. A escrita de Conceição Evaristo combina delicadeza, crítica e profundidade emocional.',insights:[['Relações afetivas','A obra investiga como laços amorosos e familiares moldam a identidade das personagens.'],['Masculinidade','O romance reflete sobre comportamentos masculinos e suas consequências nas relações.'],['Memória e vivência','A narrativa articula lembranças, trajetórias e marcas sociais para dar espessura à história.']],bio:[{name:'Conceição Evaristo',tag:'Escritora e intelectual',text:'Conceição Evaristo nasceu em Belo Horizonte, em 1946. Escritora, pesquisadora e referência da literatura brasileira contemporânea, destacou-se por obras em que a experiência da população negra, especialmente das mulheres negras, ganha centralidade.'},{name:'Escrevivência',tag:'Conceito literário',text:'A autora é associada ao conceito de “escrevivência”, uma escrita marcada pela experiência vivida, pela memória coletiva e por vozes historicamente silenciadas. Entre suas obras mais conhecidas estão Ponciá Vicêncio, Olhos d’água e Becos da memória.'}],questions:[['O que torna este romance especial?','A combinação entre densidade emocional, crítica social e um olhar sensível para as relações humanas.'],['Quais temas aparecem com força?','Afeto, memória, masculinidade, racismo, identidade e o lugar da mulher negra nas relações sociais.'],['Quem é o protagonista?','Fio Jasmim é o personagem central, mas a obra também valoriza as perspectivas das mulheres que atravessam sua trajetória.']],reflection:'De que forma as relações que vivemos moldam quem nos tornamos?',source:'https://www.pallaseditora.com.br/produto/cancao-para-ninar-menino-grande/'},
{title:'Por que fazemos o que fazemos?',short:'Por que fazemos o que fazemos?',cover:'Por que fazemos\no que fazemos?',author:'Mario Sergio Cortella',small:'Mario Sergio Cortella',year:'2016 · Editora Planeta',label:'Propósito e trabalho',tone:'#d4a70d',halo:'#6b5a14',theme:1,coverImage:"imagens/capa-1.webp",coverPosition:"50% 50%",summary:'Livro de Mario Sergio Cortella que reflete sobre trabalho, carreira, motivação, rotina, sentido e realização pessoal no cotidiano profissional.',intro:'Mais do que falar de emprego, o livro convida a pensar no sentido das escolhas, no valor do tempo e no que nos move todos os dias.',discussion:'Cortella propõe uma reflexão acessível sobre o mundo do trabalho e sobre como lidamos com propósito, rotina, cansaço e ambição. Em linguagem direta, o autor questiona automatismos e estimula o leitor a buscar consciência sobre aquilo que faz e por quê.',insights:[['Propósito','Trabalhar com sentido ajuda a sustentar esforço, disciplina e compromisso.'],['Carreira','O livro diferencia emprego, profissão e projeto de vida, ampliando a reflexão.'],['Realização','A satisfação não nasce apenas do resultado, mas também do significado atribuído ao percurso.']],bio:[{name:'Mario Sergio Cortella',tag:'Filósofo e escritor',text:'Mario Sergio Cortella nasceu em Londrina, em 1954. Filósofo, professor e escritor, tornou-se conhecido por aproximar reflexão filosófica e cotidiano, especialmente em temas como educação, ética, liderança e trabalho.'},{name:'Trajetória pública',tag:'Educação e comunicação',text:'Foi secretário municipal de Educação em São Paulo e é autor de diversos livros e palestras. Sua linguagem clara e provocativa faz com que ideias filosóficas dialoguem com questões práticas da vida profissional.'}],questions:[['Sobre o que trata o livro?','Ele trata da relação entre trabalho, propósito, motivação, carreira e realização pessoal.'],['O livro é voltado apenas para empresas?','Não. Embora fale muito do ambiente profissional, as reflexões servem para qualquer pessoa que pense sobre escolhas e sentido da própria rotina.'],['Qual é a principal provocação da obra?','Pensar se estamos apenas repetindo tarefas ou se entendemos verdadeiramente por que fazemos o que fazemos.']],reflection:'O que há no seu dia a dia que faz sentido de verdade para você?',source:'https://www.planetadelivros.com.br/livro-por-que-fazemos-o-que-fazemos/186106'},
{title:'A monja e o poeta',short:'A monja e o poeta',cover:'A monja\ne o poeta',author:'Allan Dias Castro & Monja Coen',small:'Allan Dias Castro · Monja Coen',year:'2021 · Editora Sextante',label:'Poesia e autoconhecimento',tone:'#72977c',halo:'#355447',theme:2,coverImage:"imagens/capa-2.webp",coverPosition:"50% 45%",summary:'Um encontro entre poesia e sabedoria zen-budista, em reflexões sobre amor, perdão, gratidão, medo e felicidade.',intro:'Duas maneiras de olhar a vida encontram um lugar comum: a sensibilidade de um poema e a atenção de quem aprende a estar presente.',discussion:'Em onze capítulos, versos de Allan Dias Castro encontram comentários e ensinamentos de Monja Coen. A proposta é observar sentimentos humanos com delicadeza e abertura, unindo linguagem poética e reflexão sobre a existência.',insights:[['Poesia','As palavras expressam sentimentos complexos e abrem espaço para novas leituras do cotidiano.'],['Atenção ao presente','A perspectiva zen convida a observar experiências e emoções com maior consciência.'],['Transformação','Amor, medo, perdão e gratidão surgem como oportunidades de aprendizado.']],bio:[{name:'Allan Dias Castro',tag:'Poeta e compositor',text:'Allan Dias Castro é poeta, escritor e compositor brasileiro. Publicou O Zé-Ninguém em 2014 e Voz ao verbo em 2019. Seus trabalhos com poesia falada aproximam a linguagem poética de questões emocionais e da vida cotidiana.'},{name:'Monja Coen',tag:'Monja zen-budista e escritora',text:'Monja Coen é uma monja zen-budista brasileira, fundadora da Comunidade Zendo Brasil. Com formação em mosteiros no exterior, tornou-se conhecida por compartilhar ensinamentos sobre meditação, atenção, convivência e autoconhecimento.'}],questions:[['Como o livro é organizado?','A obra tem onze capítulos temáticos, com poemas de Allan Dias Castro e reflexões de Monja Coen.'],['É necessário conhecer o zen-budismo?','Não. A linguagem busca aproximar reflexões filosóficas e espirituais de experiências humanas comuns.'],['Qual é o papel da poesia?','A poesia abre o tema pelo sentimento e pela imagem; as reflexões ampliam os sentidos possíveis para cada experiência.']],reflection:'Quando foi a última vez que você observou o presente sem pressa?',source:'https://sextante.com.br/products/a-monja-e-o-poeta'}
];

      e.preventDefault();

      upwardIntentAt=now;
      upwardIntent+=Math.abs(e.deltaY);
      if(upwardIntent>=75){upwardIntent=0;returnHome();}
    }else if(e.deltaY>0){upwardIntent=0;}

  }

const gabrielReading=[
 {lead:'Minha leitura não ficou só no caminho de Fio Jasmim. O que sustenta o romance, para mim, é o modo como as relações mudam quando ouvimos também as mulheres que cruzam a vida dele.',title:'O protagonista não conta a história sozinho',main:'Fio Jasmim chama atenção, mas eu não acho que o livro peça para a gente olhar apenas para ele. As diferentes mulheres têm experiências e maneiras próprias de entender os encontros. Isso muda o centro da narrativa: em vez de transformar tudo numa aventura de um homem, a leitura abre espaço para perceber quem costuma ser deixado em segundo plano.',points:[['As outras vozes','Cada perspectiva acrescenta uma parte que o olhar de Fio, sozinho, não alcançaria.'],['Afeto e consequência','Relações não são só sentimentos: as escolhas também afetam outras pessoas.'],['Minha conclusão','Para mim, ouvir as mulheres é o que dá mais força e profundidade ao romance.']],detail:'A estrutura me fez prestar atenção em quem tem espaço para falar e em como a mesma relação pode ser lembrada de maneiras diferentes. Essa escolha combina com a escrita de Conceição Evaristo, que valoriza memória e experiência. Não terminei com uma resposta fechada sobre Fio; terminei pensando no contraste entre o que ele acredita viver e o que as outras pessoas realmente vivem ao lado dele.',end:'O livro me deixou com uma ideia clara: uma história muda bastante quando a gente escuta quem antes aparecia só como parte da vida de outra pessoa.',question:'Que parte da história ficaria diferente se fosse contada por outra personagem?'},
 {lead:'Eu li o livro do Cortella como uma conversa sobre trabalho, mas a pergunta do título acabou chegando também às escolhas que faço fora dele.',title:'A pergunta é simples; a resposta não vem pronta',main:'O que funciona para mim é o livro não tratar propósito como uma frase bonita que resolve tudo. Ele provoca a pensar por que repetimos certas tarefas, o que esperamos do trabalho e como a rotina ocupa nosso tempo. Algumas ideias parecem diretas, mas continuam relevantes quando a gente compara com a própria experiência.',points:[['Rotina','Repetir uma tarefa não significa que a gente já pensou sobre o motivo dela.'],['Escolhas','O sentido também aparece nos objetivos que eu decido perseguir.'],['Minha conclusão','Não encontrei uma fórmula: encontrei perguntas para avaliar melhor minhas prioridades.']],detail:'O formato de reflexões curtas deixa a leitura fácil de retomar, e isso combina com o assunto: dá para parar e pensar em uma situação concreta do dia. Eu não concordo que todo trabalho precise ser uma grande paixão para ter valor. Para mim, a provocação mais interessante é perceber se entendo o que estou fazendo e se as escolhas que mantenho ainda fazem sentido.',end:'Saí da leitura menos interessado em achar uma resposta perfeita e mais atento aos motivos por trás das decisões que tomo.',question:'O que, na sua rotina, você mantém por escolha e o que continua só por hábito?'},
 {lead:'Para mim, a força deste livro está no diálogo: o poema apresenta uma sensação, e a reflexão de Monja Coen abre outro caminho para olhar para ela.',title:'Duas vozes, sem uma resposta única',main:'Não li A monja e o poeta como um manual de respostas. Os poemas de Allan Dias Castro e os comentários de Monja Coen se alternam e criam uma pausa entre sentir e pensar. A estrutura ajuda a ler com calma, sem precisar concordar com tudo ou transformar cada ideia em regra.',points:[['O poema','A imagem e o sentimento vêm primeiro e deixam espaço para a interpretação.'],['A reflexão','A resposta amplia o assunto, mas não apaga o que cada leitor percebeu.'],['Minha conclusão','O diálogo entre os autores é mais interessante do que procurar uma lição única.']],detail:'Eu achei importante que o livro tenha duas vozes diferentes. O poema pode falar de uma experiência de forma mais aberta; depois, a reflexão traz a perspectiva de Monja Coen e dos ensinamentos zen. Para mim, essa diferença não é uma disputa para ver quem está certo. É justamente o que permite reler o mesmo tema por mais de um ângulo.',end:'O livro me lembrou que pensar com calma também é uma escolha: nem todo sentimento precisa de uma resposta imediata.',question:'Qual dos dois olhares mudou mais a maneira como você entendeu um tema do livro?'}
];
function renderSite(){
 const b=books[selected],t=themeExtras[b.theme],posts=editorialPosts[b.theme],reading=gabrielReading[b.theme];
 const bioMarkup = b.bio.map(a=>{const photo=photoFor(a.name);return `<article class="bio-card">${photo?`<img src="${photo.src}" alt="Retrato de ${a.name}" loading="lazy">`:''}<div><span class="role">${a.tag}</span><h3>${a.name}</h3><p>${a.text}</p></div></article>`}).join('');
 document.title = `${b.title} — Blog de livros`;
 site.dataset.theme = b.theme;
 site.innerHTML = `<div class="read-progress" id="progress"></div>
 <header class="site-header"><div class="brand"><span class="star">✳</span>Blog de livros</div><nav class="header-right"><button class="small-btn" id="backTop">← Escolher livro</button></nav></header>
 <main class="magazine refined">
   <section class="issue-hero">
     <div class="issue-main">
       <span class="issue-kicker">Blog de livros · edição ${String(selected+1).padStart(2,'0')}</span>
       <h1 class="issue-title">${b.title}</h1>
       <p class="issue-intro">${reading.lead}</p>
       <div class="hero-chips">${t.chips.map(ch=>`<span>${ch}</span>`).join('')}</div>
       <div class="issue-meta"><span>${b.author}</span><span>${b.year}</span><span>${b.label}</span></div>
     </div>
     <div class="issue-side">
        <div class="cover-shell"><div class="magazine-cover">${cover(b,selected)}</div><div class="cover-caption">O livro que estou comentando nesta edição.</div></div>
     </div>
   </section>

   <nav class="mini-nav" aria-label="Navegar pelo blog">
     <a href="#artigos">Minha leitura</a>
     <a href="#imagens">Imagens</a>
     <a href="#biografia">Autores</a>
     <a href="#refletir">Conclusão</a>
   </nav>

   <section id="artigos" class="blog-grid">
     <article class="feature-shell">
       <div class="feature-visual">
         <div class="feature-copy">
           <span class="issue-kicker">Meu ponto de vista</span>
           <h2>${reading.title}</h2>
           <p>${reading.main}</p>
         </div>
       </div>
     </article>
     <aside class="side-stack">
       <div class="fact-shell">
         <h3 class="fact-title">O que eu observo</h3>
         <div class="fact-grid reading-facts">
           <div><strong>${reading.points[0][0]}</strong><span>${reading.points[0][1]}</span></div>
         </div>
       </div>
     </aside>
   </section>

    <section class="related-reading" aria-label="Outros pontos da minha leitura">
      <div class="related-reading-heading"><span class="issue-kicker">O que ficou da leitura</span><h2>Duas ideias que completam meu olhar</h2></div>
      <div class="related-reading-grid">${reading.points.slice(1).map((point,i)=>`<article class="related-post"><span class="issue-kicker">0${i+2} · Minha leitura</span><h3>${point[0]}</h3><p>${point[1]}</p></article>`).join('')}</div>
    </section>

     <div id="imagens">${renderPhotoStory(b.theme,b)}</div>

   <section id="livro" class="section-shell">
     <span class="section-label">Minha leitura</span>
     <h2>O que eu entendi da obra</h2>
     <div class="text-aside">
       <div>
         <p>${reading.detail}</p>
       </div>
       <aside class="theme-note">
         <h3>Um ponto de partida</h3>
         <p>${b.intro}</p>
         <div class="chips">${t.chips.map(ch=>`<span>${ch}</span>`).join('')}</div>
       </aside>
     </div>
   </section>

   <section id="biografia" class="section-shell">
     <span class="section-label">Biografia</span>
     <h2>Quem escreve este universo literário</h2>
     <div class="bio-list">${bioMarkup}</div>
   </section>

   <section id="refletir" class="section-shell">
     <span class="section-label">Fechando a leitura</span>
     <h2>O que eu levo deste livro?</h2>
     <div class="text-aside">
       <div class="question-list"><article class="question-item reading-conclusion"><h3>Minha conclusão</h3><p>${reading.end}</p></article></div>
       <aside class="quote-shell"><blockquote>${reading.question}</blockquote><span>Uma pergunta para conversar</span></aside>
     </div>
   </section>

   <footer class="footer-row"><span>✳ Blog de livros · três livros, três universos</span><a href="${b.source}" target="_blank" rel="noopener noreferrer">Informações da editora ↗</a></footer>
 </main>
 <div class="article-layer" id="articleLayer" hidden><div class="article-backdrop" id="articleBackdrop"></div><article class="article-paper" role="dialog" aria-modal="true" aria-labelledby="articleTitle"><button class="article-close" id="articleClose" aria-label="Fechar artigo">✕ Fechar</button><div id="articleContent"></div></article></div>`;
 document.getElementById('backTop').onclick = returnHome;
 const layer = document.getElementById('articleLayer');
 function closeArticle(){layer.hidden=true;document.body.classList.remove('article-active')}
 site.querySelectorAll('.post-open').forEach(btn=>btn.onclick=()=>{
   const post=posts[Number(btn.dataset.post)];
   document.getElementById('articleContent').innerHTML = `<div class="article-text"><span class="post-tag">${post.category} · ${post.read||'Artigo'}</span><h2 id="articleTitle">${post.title}</h2><p class="article-deck">${post.excerpt}</p>${post.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="article-note">Uma leitura de <strong>${b.title}</strong>, de ${b.author}.</div></div>`;
   layer.hidden = false; document.body.classList.add('article-active'); layer.querySelector('.article-paper').scrollTop = 0; document.getElementById('articleClose').focus();
 });
 document.getElementById('articleClose').onclick = closeArticle;
 document.getElementById('articleBackdrop').onclick = closeArticle;
  layer.addEventListener('keydown',event=>{if(event.key==='Escape')closeArticle()});
 updateProgress();
}
function observe(){const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08});site.querySelectorAll('.reveal').forEach(el=>io.observe(el))}
function updateProgress(){if(!entered)return;const max=document.documentElement.scrollHeight-innerHeight;const p=Math.max(0,Math.min(100,max?scrollY/max*100:0));const el=document.getElementById('progress');if(el)el.style.width=p+'%'}window.addEventListener('scroll',updateProgress,{passive:true});
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2400)}paint();

/* Liquid illumination: atualização leve, apenas variáveis CSS. */
(function(){
  let scheduled=false,px=50,py=45;
  document.addEventListener('pointermove',function(event){
    if(event.pointerType==='touch')return;
    px=Math.max(0,Math.min(100,event.clientX/window.innerWidth*100));
    py=Math.max(0,Math.min(100,event.clientY/window.innerHeight*100));
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(function(){
      document.documentElement.style.setProperty('--liquid-x',px+'%');
      document.documentElement.style.setProperty('--liquid-y',py+'%');
      scheduled=false;
    });
  },{passive:true});
})();

</script>
</body></html>
