<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#191a1c">
  <title>Configuração inicial · Blog escolar do Gabriel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at 50% 5%,#59402f 0%,#191a1c 58%,#111315 100%);color:#f7f1e8;font-family:'DM Sans',sans-serif}.card{width:min(100%,470px);padding:clamp(25px,6vw,42px);border:1px solid #ffffff24;border-radius:22px;background:#ffffff0a;box-shadow:0 24px 70px #0005}.kicker{color:#d9b987;font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}h1{margin:12px 0;color:#f8f0e4;font:clamp(30px,8vw,42px)/1.05 'Playfair Display',Georgia,serif}p{color:#c7c0b6;font-size:13px;line-height:1.7}form{display:grid;gap:10px;margin-top:22px}label{margin-top:7px;color:#e8ddcb;font-size:12px;font-weight:700}input{width:100%;padding:13px 14px;border:1px solid #ffffff35;border-radius:10px;background:#121416;color:#fff;font:inherit}button,.back{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding:14px 17px;border:0;border-radius:50px;background:#d2a76c;color:#1d1b19;font-weight:800;text-decoration:none;cursor:pointer}.message{min-height:22px;color:#ffc2bd;font-size:12px}button:disabled{opacity:.65}
  </style>
</head>
<body>
  <main class="card">
    <span class="kicker">Só na primeira vez</span>
    <h1>Criar a conta administradora</h1>
    <p>Digite o código inicial configurado no Cloudflare, o e-mail e a senha da conta principal. Depois disso, essa configuração fica bloqueada.</p>
    <form id="setupForm">
      <label for="code">Código inicial do Cloudflare</label><input id="code" name="code" type="password" autocomplete="off" required>
      <label for="email">E-mail da conta principal</label><input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="password">Senha (mínimo 12 caracteres)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <p class="message" id="message" role="status" aria-live="polite"></p>
      <button id="submit" type="submit">Criar conta e continuar ↗</button>
    </form>
    <a class="back" href="/">Voltar para a entrada</a>
  </main>
  <script>
    const form=document.getElementById('setupForm'),message=document.getElementById('message'),submit=document.getElementById('submit');
    form.addEventListener('submit',async e=>{e.preventDefault();if(!form.reportValidity())return;submit.disabled=true;message.textContent='Criando a conta…';try{const response=await fetch('/api/auth/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:form.code.value,email:form.email.value.trim(),password:form.password.value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'Não foi possível criar a conta.');location.replace('/')}catch(error){message.textContent=error.message}finally{submit.disabled=false}});
  </script>
</body>
</html>
